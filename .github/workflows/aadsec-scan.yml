name: AADSec Security Audit Demo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  aadsec-audit:
    name: Run AADSec Local-First Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull AADSec Runner Image
        run: |
          echo "Pulling official AADSec runner image..."
          docker pull ghcr.io/aadieng100/aadsec-runner:0.1.0-alpha.1

      - name: Install AADSec CLI (Beta)
        run: |
          echo "Installing AADSec CLI..."
          curl -sSL https://raw.githubusercontent.com/aadieng100/aadsec-public/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run AADSec Diagnostics
        run: |
          aadsec doctor || true

      - name: Run AADSec Scan
        run: |
          echo "Scanning intentionally vulnerable demo project..."
          # The scan will detect P0/P1 issues and return exit code 1 or 0 based on threshold
          aadsec scan . --format html,json --output security-output || true

      - name: Upload AADSec Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aadsec-audit-report
          path: security-output/
          if-no-files-found: warn

  standalone-scanners-reference:
    name: Standalone Scanners Reference (For comparison)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Run Semgrep (SAST)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --severity ERROR,WARNING || true

      - name: Run Trivy (Vulnerabilities & Misconfigurations)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Run Checkov (IaC)
        name: Run Checkov
        run: |
          python3 -m pip install checkov
          checkov -d terraform/ || true
